<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>We Are 26 Héctor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Cromo Sector</p>
      <h1>We Are 26 Héctor</h1>
      <p class="sub">Seguimiento de tu colección FIFA World Cup 2026 Adrenalyn XL</p>
    </div>
  </header>

  <section class="dashboard" id="dashboard">
    <article><span>Tengo</span><strong id="ownedCount">0</strong></article>
    <article><span>Me faltan</span><strong id="missingCount">0</strong></article>
    <article><span>Repetidas</span><strong id="duplicateCount">0</strong></article>
    <article><span>Completado</span><strong id="progressPercent">0%</strong></article>
  </section>

  <section class="controls">
    <input id="search" type="search" placeholder="Buscar por número, nombre o equipo">
    <select id="teamFilter"><option value="">Todas las selecciones</option></select>
    <select id="typeFilter">
      <option value="">Todos los tipos</option>
      <option value="golden_baller">Golden Baller</option>
      <option value="base">Base</option>
      <option value="contenders">Contenders</option>
      <option value="contenders_player">Contenders Player</option>
      <option value="top_keeper">Top Keepers</option>
      <option value="defensive_rock">Defensive Rocks</option>
      <option value="midfield_maestro">Midfield Maestros</option>
      <option value="goal_machine">Goal Machines</option>
      <option value="master_rookie">Master Rookies</option>
      <option value="official_emblem">Official Emblem</option>
      <option value="official_mascot">Official Mascot</option>
      <option value="eternos_22">Eternos 22</option>
    </select>
    <select id="statusFilter">
      <option value="">Todos los estados</option>
      <option value="owned">Tengo</option>
      <option value="missing">Me faltan</option>
      <option value="duplicates">Repetidas</option>
    </select>
  </section>

  <section class="legend">
    <span><i class="dot owned"></i>Tengo</span>
    <span><i class="dot missing"></i>Me falta</span>
    <span><i class="dot duplicate"></i>Repetida</span>
  </section>

  <main>
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <template id="cardTemplate">
    <article class="card-item">
      <div class="card-head">
        <span class="num"></span>
        <span class="badge"></span>
      </div>
      <h3 class="name"></h3>
      <p class="team"></p>
      <p class="meta"></p>
      <div class="actions">
        <button data-action="decrement">-</button>
        <button data-action="increment">+</button>
      </div>
    </article>
  </template>

  <script src="./app.js" type="module"></script>
</body>
</html>
