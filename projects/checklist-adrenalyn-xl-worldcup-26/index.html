<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checklist Adrenaline XL WorlCup 26</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./supabase-js.min.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./i18n.js"></script>
  <script src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="locale-row">
        <label for="localeSelectorLogin">🌐</label>
        <select id="localeSelectorLogin" aria-label="Cambiar idioma">
          <option value="es-ES">🇪🇸 Español</option>
          <option value="pt-PT">🇵🇹 Português</option>
        </select>
      </div>
      <h1 id="loginTitle">Accede a tu checklist</h1>
      <p id="loginSubtitle" class="sub">Base multiusuario lista para evolucionar a plataforma de pago.</p>
      <div id="googleLoginButton" class="google-login-slot"></div>
      <form id="emailLoginForm" class="login-form">
        <input id="emailInput" type="email" placeholder="tu@email.com" autocomplete="email" required>
        <div class="password-field">
          <input id="passwordInput" type="password" placeholder="Contraseña" autocomplete="current-password" required>
          <button type="button" id="togglePasswordButton" class="toggle-password">Ver</button>
        </div>
        <label class="remember-row"><input id="rememberMeCheckbox" type="checkbox"> <span id="rememberMeLabel">Recordar acceso</span></label>
        <div class="login-actions">
          <button type="button" id="emailSignInButton">Entrar</button>
          <button type="button" id="emailSignUpButton">Crear cuenta</button>
        </div>
      </form>
      <p id="loginMessage" class="login-message"></p>
    </div>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <div>
        <h1 id="appTitle">Checklist Adrenaline XL WorlCup 26</h1>
        <p id="appSubtitle" class="sub">Seguimiento multiusuario de la colección FIFA World Cup 2026 Adrenalyn XL</p>
      </div>
      <div class="session-box">
        <div class="locale-row locale-row-top">
          <label for="localeSelectorTop">🌐</label>
          <select id="localeSelectorTop" aria-label="Cambiar idioma">
            <option value="es-ES">🇪🇸 Español</option>
            <option value="pt-PT">🇵🇹 Português</option>
          </select>
        </div>
        <span id="currentUser"></span>
        <div id="trialUpgradeSlot" class="trial-upgrade-slot" hidden></div>
        <div class="session-actions">
          <button id="adminLink" type="button" hidden>Admin</button>
          <button id="logoutButton" type="button">Salir</button>
        </div>
      </div>
    </header>

    <section id="appView">
      <section class="dashboard" id="dashboard">
        <article><span id="labelOwned">Tengo</span><strong id="ownedCount">0</strong></article>
        <article><span id="labelMissing">Me faltan</span><strong id="missingCount">0</strong></article>
        <article><span id="labelDuplicates">Repetidas</span><strong id="duplicateCount">0</strong></article>
        <article><span id="labelCompleted">Completado</span><strong id="progressPercent">0%</strong></article>
      </section>
      <section class="controls">
        <input id="search" type="search" placeholder="Buscar por número, nombre o equipo">
        <select id="teamFilter"><option value="">Todas las secciones</option></select>
        <select id="typeFilter"><option value="">Todos los tipos</option></select>
        <select id="statusFilter">
          <option value="">Todos los estados</option>
          <option value="owned">Tengo</option>
          <option value="missing">Me faltan</option>
          <option value="duplicates">Repetidas</option>
        </select>
      </section>
      <section class="legend">
        <span><i class="dot owned"></i><span id="legendOwned">Tengo</span></span>
        <span><i class="dot missing"></i><span id="legendMissing">Me falta</span></span>
        <span><i class="dot duplicate"></i><span id="legendDuplicates">Repetida</span></span>
        <span id="backupSlot"></span>
      </section>
      <main><div id="cardsGrid"></div></main>
    </section>

    <section id="adminView" class="admin-view" hidden>
      <div class="admin-toolbar">
        <h2 id="adminPanelTitle">Panel de usuarios</h2>
        <button id="backToAppButton" type="button">Volver</button>
      </div>
      <form id="createUserForm" class="admin-create-user">
        <input id="adminEmailInput" type="email" placeholder="nuevo@email.com" required>
        <input id="adminPasswordInput" type="password" placeholder="Contraseña inicial" required>
        <select id="adminPlanInput">
          <option value="basic">trial</option>
          <option value="paid">paid</option>
        </select>
        <button id="adminCreateUserButton" type="submit">Crear usuario</button>
      </form>
      <p id="adminMessage" class="login-message"></p>
      <div id="adminTable" class="admin-table"></div>
    </section>
  </div>

  <template id="cardTemplate">
    <article class="card-item">
      <div class="card-head">
        <span class="num"></span>
        <span class="badge"></span>
      </div>
      <button class="thumb-button" type="button"><img class="thumb" alt="Miniatura del cromo"></button>
      <h3 class="name"></h3>
      <p class="team"></p>
      <p class="meta"></p>
      <div class="actions">
        <button data-action="decrement">−</button>
        <button data-action="increment">+</button>
      </div>
    </article>
  </template>
  <dialog id="imageModal" class="image-modal">
    <button id="closeModal" class="close-modal" type="button">✕</button>
    <img id="modalImage" alt="Cromo ampliado">
  </dialog>
  <script src="./app.js" type="module"></script>
</body>
</html>
