      b:[[1,'A.D.R. Pasteleira "B"',1,1,0,0,16,0,3],[2,'S.C. Salgueiros "D"',1,1,0,0,11,0,3],[3,'S.C. Senhora Hora "B"',1,1,0,0,2,0,3],[4,'C.F. Oliveira Douro "B"',0,0,0,0,0,0,0],[4,'Dragon Force F.C. "C"',0,0,0,0,0,0,0],[4,'F.C. Avintes "B"',0,0,0,0,0,0,0],[4,'F.C. Foz "C"',0,0,0,0,0,0,0],[4,'Spg. C. Coimbrões "B"',0,0,0,0,0,0,0],[4,'Spg. C. Cruz "B"',0,0,0,0,0,0,0],[10,'Valadares Gaia F.C. "B"',1,0,0,1,0,2,0],[11,'S.C. Canidelo "B"',1,0,0,1,0,11,0],[12,'Ramaldense F.C. "B"',1,0,0,1,0,16,0]],
      c:[[1,'F.C. Porto "E" - Sad',1,1,0,0,15,0,3],[2,'Dragon Force F.C. "B"',1,1,0,0,7,0,3],[3,'S.C. Senhora Hora "C"',1,1,0,0,5,1,3],[4,'A.J.E.F. Hernâni Gonçalves "B"',1,1,0,0,5,2,3],[5,'F.C. Foz "B"',1,1,0,0,3,1,3],[6,'S.C. Salgueiros "C"',1,1,0,0,1,0,3],[7,'Ramaldense F.C.',1,0,0,1,0,1,0],[8,'Panteras Negras F.C.',1,0,0,1,1,3,0],[9,'Spg. C. Cruz',1,0,0,1,2,5,0],[10,'C.D. Portugal',1,0,0,1,1,5,0],[11,'A.D.R. Pasteleira',1,0,0,1,0,7,0],[12,'C. Atl. Rio Tinto "B"',1,0,0,1,0,15,0]]
    };
    function venue(opponent){const v=V[opponent];return {venue:v[0],area:v[1],surface:v[2],mapQuery:v[0]==='Recinto a indicar'?'':v[0]+' '+v[1]}}
    function fixtures(key){return PAIRS[key].flatMap((p,i)=>{const side2=p[2]==='home'?'away':'home';return [{team:key,round:i+1,id:p[0],date:D1[i],time:TIMES[p[0]]||'11:00',opponent:p[3],side:p[2],...(VENUE_OVERRIDES[p[0]]||(p[2]==='home'?HOME:venue(p[3]))),...(RESULTS[p[0]]||{})},{team:key,round:i+12,id:p[1],date:D2[i],time:TIMES[p[1]]||'11:00',opponent:p[3],side:side2,...(VENUE_OVERRIDES[p[1]]||(side2==='home'?HOME:venue(p[3]))),...(RESULTS[p[1]]||{})}]}).sort((a,b)=>a.round-b.round)}
    let team=localStorage.getItem('scsh-team')||'b',tab='games',filter='all'; const select=document.querySelector('#team'),content=document.querySelector('#content'),dialog=document.querySelector('#matchDialog');select.value=team;
    const dShort=new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'short'}),dLong=new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});function date(s){return new Date(s+'T12:00:00+01:00')}function names(m){return m.side==='home'?[TEAMS[m.team].fullName,m.opponent]:[m.opponent,TEAMS[m.team].fullName]}
    function scorerTotals(games){const totals=new Map();games.flatMap(m=>m.scorers||[]).forEach(name=>totals.set(name,(totals.get(name)||0)+1));return [...totals.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt'))}
    function render(){
      const cfg=TEAMS[team],games=fixtures(team);
      document.querySelector('#competition').textContent=cfg.competition+' · '+cfg.series;
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
      if(tab==='games'){
        const next=games.find(m=>date(m.date)>=new Date(new Date().setHours(0,0,0,0)))||games.at(-1),[home,away]=names(next),shown=games.filter(m=>filter==='all'||m.side===filter);
        content.innerHTML=`<div class="layout"><aside class="next-wrap"><button class="next" data-id="${next.id}"><div class="next-top"><div class="next-copy"><p class="next-kicker">Próximo jogo · Jornada ${next.round}</p><p class="club">${home}</p><p class="club"><span class="versus">vs</span> ${away}</p><span class="side">${next.side==='home'?'Em casa':'Fora de casa'}</span></div><div class="datebox"><p class="month">${dShort.format(date(next.date)).split(' ')[1]}</p><p class="day">${date(next.date).getDate()}</p><p class="time">${next.time}</p></div></div><div class="venuebar"><b>⌖ ${next.venue}</b><span>›</span></div></button></aside><section class="calendar"><div class="section-title"><div><h2>Calendário</h2><p class="sub">22 jornadas · 11 em casa · 11 fora</p></div><div class="filters">${[['all','Todos'],['home','Casa'],['away','Fora']].map(x=>`<button class="filter ${filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="games">${shown.map(m=>`<button class="game" data-id="${m.id}"><div class="round"><small>J${m.round}</small><strong>${dShort.format(date(m.date)).replace('.','')}</strong><em>${m.time}</em></div><div class="opponent"><strong>${m.opponent}</strong><span>⌖ ${m.venue}</span></div>${m.homeGoals!==undefined?`<span class="score">${m.homeGoals}–${m.awayGoals}</span>`:`<span class="pill ${m.side}">${m.side==='home'?'Casa':'Fora'}</span>`}</button>`).join('')}</div></section></div>`;
      }else if(tab==='table'){
        content.innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Classificação</h2><p class="sub">${cfg.series.split(' · ')[0]} · Jornada 1</p></div><span style="font-size:28px">♜</span></div><div class="table-scroll"><div class="table-head"><span>#</span><span>Equipa</span><span class="center">J</span><span class="center">V</span><span class="center">E</span><span class="center">D</span><span class="center">GM</span><span class="center">GS</span><span class="center">Pts</span></div>${STANDINGS[team].map(r=>`<div class="row ${r[1]===cfg.fullName?'scsh':''}"><span>${r[0]}</span><span>${r[1]}</span>${r.slice(2).map(v=>`<span class="center">${v}</span>`).join('')}</div>`).join('')}</div></section>`;
      }else if(tab==='scorers'){
        const scorers=scorerTotals(games);
        content.innerHTML=scorers.length?`<section class="panel"><div class="panel-head"><div><h2>Marcadores</h2><p class="sub">Golos publicados nas fichas oficiais</p></div><span style="font-size:28px">🏅</span></div>${scorers.map(([name,goals],i)=>`<div class="scorer-row"><span class="rank">${i+1}</span><strong>${name}</strong><span class="goals">${goals}</span></div>`).join('')}</section>`:`<section class="panel empty"><div class="empty-icon">🏅</div><h2>Marcadores</h2><p>A ficha oficial deste jogo ainda não inclui eventos nem autores dos golos.</p></section>`;
      }else{
        content.innerHTML=`<div style="display:grid;gap:16px"><section class="data-card"><p class="next-kicker">Estado dos dados</p><h2 style="margin-top:4px">Jornada 1 completa e classificações atualizadas</h2><div class="status-grid"><div class="status"><small>Última revisão</small><b>19 out 2026</b></div><div class="status"><small>Fonte</small><b>FPF / AF Porto</b></div></div></section><section class="panel" style="padding:20px"><h2 style="font-size:21px">Fontes oficiais</h2><a class="source" href="${official}" target="_blank" rel="noreferrer"><span>Circular 127 · AF Porto<small>Calendário Sub-15 III Divisão · 2026/27</small></span>↗</a><a class="source" href="${markings}" target="_blank" rel="noreferrer"><span>Circular 230 · AF Porto<small>Horários oficiais · 19 a 25 out</small></span>↗</a><a class="source" href="${fpf}" target="_blank" rel="noreferrer"><span>Centro de Resultados · FPF<small>Competição 29764 · Época 2026/27</small></span>↗</a><p class="sub" style="margin-top:16px;line-height:1.6">Resultados e classificações das três equipas confirmados. Os marcadores do A e do C constam das fichas oficiais; o B ainda não tem eventos de jogo publicados.</p></section></div>`;
      }
      bind();
    }
    function bind(){content.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openMatch(b.dataset.id));content.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}
    function openMatch(id){
      const m=fixtures(team).find(x=>x.id===id),[home,away]=names(m),destination=m.venue+', '+m.area,map=m.mapQuery?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+'&travelmode=driving':'',compact=m.date.replaceAll('-',''),parts=m.time.split(':').map(Number),start=compact+'T'+String(parts[0]).padStart(2,'0')+String(parts[1]).padStart(2,'0')+'00',end=compact+'T'+String(parts[0]+2).padStart(2,'0')+String(parts[1]).padStart(2,'0')+'00',ics='data:text/calendar;charset=utf-8,'+encodeURIComponent(['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',`UID:${m.id}@scsh-matchday`,`DTSTART;TZID=Europe/Lisbon:${start}`,`DTEND;TZID=Europe/Lisbon:${end}`,`SUMMARY:${home} vs ${away}`,`LOCATION:${m.venue}, ${m.area}`,'END:VEVENT','END:VCALENDAR'].join('\r\n'));
      const result=m.homeGoals!==undefined?`<div class="result-card"><div class="result-line"><span>Resultado final</span><strong>${m.homeGoals}–${m.awayGoals}</strong></div><p>${m.scorers?.length?'Golos SCSH: '+m.scorers.join(' · '):'Autores dos golos não publicados na ficha oficial.'}</p></div>`:'',report=m.report?`<a class="action secondary" href="${m.report}" target="_blank" rel="noreferrer">Ficha oficial do jogo</a>`:'';
      document.querySelector('#modalContent').innerHTML=`<p class="modal-meta">Jornada ${m.round} · Jogo ${m.id}</p><h2>${home}<br><span style="color:var(--muted)">vs</span> ${away}</h2><p class="sub">${m.side==='home'?'Jogo em casa':'Deslocação'}</p>${result}<div class="detail-grid"><div class="detail"><small>Data</small><b>${dLong.format(date(m.date))}</b></div><div class="detail"><small>Hora oficial</small><b>${m.time}</b></div></div><div class="place"><b>⌖ ${m.venue}</b><span>${m.area}</span><span>${m.surface}</span></div><div class="actions">${map?'<button id="openMaps" type="button" class="action" style="border:0;cursor:pointer">Como chegar</button>':'<button type="button" class="action" style="border:0;opacity:.5" disabled>Recinto por confirmar</button>'}<a class="action secondary" href="${ics}" download="J${m.round}-SCSH-${team.toUpperCase()}.ics">Adicionar ao calendário</a>${report}</div>`;
      if(map)document.querySelector('#openMaps').onclick=()=>window.location.assign(map);
      dialog.showModal();
    }
    select.onchange=()=>{team=select.value;filter='all';localStorage.setItem('scsh-team',team);render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('.close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};render();
  </script>
